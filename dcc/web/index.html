<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCC Sniffer</title>
<!--
  Viewer for the ESP32-C3 DCC sniffer (../main/ble_link.c) over Web
  Bluetooth. Single file, no dependencies. Web Bluetooth needs Chrome or
  Edge (desktop or Android) and a secure context: open it via
  `make web` (http://localhost:8000) or any https host, not file://.
-->
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
  --border: #e2e2de; --accent: #2f6fde; --ok: #1f8a4c; --warn: #b26a00;
  --bad: #c0362c; --flash: #fff3c4; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --loco: #2f6fde; --acc: #1f8a4c; --idle: #8a8a90; --other: #8a4fd8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151517; --panel: #1e1e21; --text: #ececee; --muted: #9a9aa2;
    --border: #2e2e33; --accent: #6b9cff; --ok: #4fc483; --warn: #e0a040;
    --bad: #ff6b5e; --flash: #4a3f12; --loco: #6b9cff; --acc: #4fc483;
    --idle: #77777f; --other: #b18cff;
  }
}
:root[data-theme="dark"] {
  --bg: #151517; --panel: #1e1e21; --text: #ececee; --muted: #9a9aa2;
  --border: #2e2e33; --accent: #6b9cff; --ok: #4fc483; --warn: #e0a040;
  --bad: #ff6b5e; --flash: #4a3f12; --loco: #6b9cff; --acc: #4fc483;
  --idle: #77777f; --other: #b18cff;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  position: sticky; top: 0; z-index: 2;
}
header h1 { font-size: 16px; margin: 0 8px 0 0; }
.status { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); }
.dot.on { background: var(--ok); }
.dot.busy { background: var(--warn); }
.dot.err { background: var(--bad); }
.metrics { display: flex; gap: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.metrics b { color: var(--text); font-weight: 600; }
.spacer { flex: 1; }
button {
  font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
}
select {
  font: inherit; padding: 5px 8px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
}
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
main {
  display: grid; grid-template-columns: minmax(300px, 2fr) 3fr; gap: 16px;
  padding: 16px; height: calc(100vh - 58px);
}
@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }
section {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
section > h2 {
  font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
  margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
}
section > h2 .tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--text); }
.scroll { overflow: auto; flex: 1; min-height: 200px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 4px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 500; font-size: 12px; z-index: 1; }
td.mono, .mono { font-family: var(--mono); font-size: 12.5px; }
td.addr { font-weight: 600; white-space: nowrap; }
td.age { color: var(--muted); white-space: nowrap; }
tr.changed td.val { background: var(--flash); transition: background 0s; }
td.val { transition: background 1.2s; }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600;
  color: #fff; text-transform: uppercase; }
.tag.loco { background: var(--loco); } .tag.acc { background: var(--acc); }
.tag.idle, .tag.reset { background: var(--idle); } .tag.other, .tag.broadcast { background: var(--other); }
.empty { color: var(--muted); padding: 24px 12px; text-align: center; }
label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
#notice { margin: 16px 16px 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--warn);
  color: var(--warn); display: none; }
</style>
</head>
<body>
<header>
  <h1>DCC Sniffer</h1>
  <span class="status"><span id="dot" class="dot"></span><span id="state">disconnected</span></span>
  <div class="metrics">
    <span><b id="rate">0</b> pkt/s</span>
    <span><b id="total">0</b> packets</span>
  </div>
  <label>Show <select id="pick"><option value="all">everything</option></select></label>
  <span class="spacer"></span>
  <button id="demo">Demo</button>
  <button id="connect" class="primary">Connect</button>
</header>
<div id="notice"></div>
<main>
  <section>
    <h2>Current state</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Address</th><th>Parameter</th><th>Value</th><th>Updated</th></tr></thead>
        <tbody id="state-body"></tbody>
      </table>
      <div id="state-empty" class="empty">No locos or accessories seen yet.</div>
    </div>
  </section>
  <section>
    <h2>Log
      <span class="tools">
        <label><input type="checkbox" class="f" value="loco" checked> loco</label>
        <label><input type="checkbox" class="f" value="acc" checked> acc</label>
        <label><input type="checkbox" class="f" value="other" checked> other</label>
        <label><input type="checkbox" class="f" value="idle"> idle</label>
        <label><input type="checkbox" id="hide-repeats" checked> hide repeats</label>
        <button id="pause">Pause</button>
        <button id="clear">Clear</button>
        <button id="csv">CSV</button>
      </span>
    </h2>
    <div class="scroll" id="log-scroll">
      <table>
        <thead><tr><th>Time (s)</th><th>Raw</th><th>Type</th><th>Description</th></tr></thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
"use strict";

// Must match main/ble_link.h.
const SERVICE_UUID = "d0cc0001-6b2e-4c8a-9f3e-5a1b2c3d4e5f";
const PACKETS_UUID = "d0cc0002-6b2e-4c8a-9f3e-5a1b2c3d4e5f";

const LOG_MAX = 5000;          // rows kept in the log
const REPEAT_WINDOW_MS = 1000; // "hide repeats": same packet seen within this

// ---------------------------------------------------------------------------
// DCC decoding. Covers the RailCommunity / NMRA packet set (see
// docs/README.md): RCN-211 packet types and global commands, RCN-212 loco
// instructions, RCN-213 accessories, RCN-214 CV access, RCN-218 DCC-A.
// Returns a text line for the log plus structured parameters for the
// state table:
//   { kind, key, text, params: [[name, value], ...], fns: [{from, count, bits}] }
// `fns` carries function states (F0..F68); the state table merges them
// into one "functions on" row per loco, whichever command they came in.
// ---------------------------------------------------------------------------

const hex = (bytes) => Array.from(bytes, (b) => b.toString(16).toUpperCase().padStart(2, "0")).join(" ");
const h2 = (b) => "0x" + hex([b]);

function fnText(from, count, bits) {
  const on = [];
  for (let i = 0; i < count; i++) if ((bits >> i) & 1) on.push(`F${from + i}`);
  const range = count === 1 ? `F${from}` : `F${from}-F${from + count - 1}`;
  return `${range} ${on.length ? "on: " + on.join(" ") : "all off"}`;
}

// RGGG-GGGG, RCN-212 2.2.2
function speed128(v) {
  const s = v & 0x7f;
  return { dir: v & 0x80 ? "forward" : "reverse",
           speed: s === 0 ? "STOP" : s === 1 ? "E-STOP" : `${s - 1} / 126` };
}

// 01RG-GGGG, RCN-212 2.2.1 (bit 4 is the speed LSB)
function speed28(b) {
  const v = ((b & 0x0f) << 1) | ((b >> 4) & 1);
  return { dir: b & 0x20 ? "forward" : "reverse",
           speed: v <= 1 ? "STOP" : v <= 3 ? "E-STOP" : `${v - 3} / 28` };
}

// IEEE 754 half precision, used by the time scale command (RCN-211 5.1).
function f16(h) {
  const s = h >> 15 ? -1 : 1, e = (h >> 10) & 0x1f, m = h & 0x3ff;
  if (e === 0) return s * m * 2 ** -24;
  if (e === 31) return m ? NaN : s * Infinity;
  return s * (1 + m / 1024) * 2 ** (e - 15);
}

const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun", "-"];

// Configuration variable access, RCN-214. `p` starts at the 111x-xxxx byte.
function cvAccess(p) {
  const b = p[0];
  if ((b & 0xf0) === 0xe0) {
    const kk = (b >> 2) & 3;
    if (p.length >= 4) {   // XPOM: 1110-KKSS + 24-bit CV address + data
      const addr = (p[1] << 16) | (p[2] << 8) | p[3];
      const op = ["reserved", "read", "bit write", "write"][kk];
      const data = p.length > 4 ? ` data ${hex(p.subarray(4))}` : "";
      const t = `XPOM ${op} CV addr 0x${addr.toString(16).toUpperCase()} seq ${b & 3}${data}`;
      return { text: t, params: [["last CV access", t]] };
    }
    if (p.length < 3) return { text: "CV access (truncated)", params: [] };
    const cv = (((b & 3) << 8) | p[1]) + 1;
    let t;
    if (kk === 1) t = `POM verify CV${cv} = ${p[2]}`;
    else if (kk === 3) t = `POM write CV${cv} = ${p[2]}`;
    else if (kk === 2) {   // 111K-DBBB
      const k = (p[2] >> 4) & 1, d = (p[2] >> 3) & 1, bit = p[2] & 7;
      t = `POM ${k ? "write" : "verify"} CV${cv} bit ${bit} = ${d}`;
    } else t = `POM reserved CV${cv}`;
    return { text: t, params: [["last CV access", t]] };
  }
  // Short form 1111-KKKK
  const kkkk = b & 0x0f;
  const names = { 0x2: "CV23 (consist accel)", 0x3: "CV24 (consist decel)",
                  0x4: "CV17+CV18 (long address)", 0x5: "CV31+CV32 (index)", 0x6: "CV19+CV20 (consist)" };
  const t = `POM short ${names[kkkk] || "KKKK=" + kkkk.toString(2).padStart(4, "0")} = ${hex(p.subarray(1))}`;
  return { text: t, params: [["last CV access", t]] };
}

// Instruction bytes of a loco packet (RCN-212), `p` without the address
// and checksum. Also used for broadcast packets.
function locoInstr(p) {
  if (p.length < 1) return { text: "(no instruction)", params: [] };
  const b = p[0];

  // 0000-xxxx decoder control
  if ((b & 0xf0) === 0x00) {
    const t = b === 0x00 ? "reset" : b === 0x01 ? "hard reset" : (b & 0xfe) === 0x02 ? "factory test"
      : (b & 0xfe) === 0x0a ? `set extended addressing (CV29.5 = ${b & 1})`
      : b === 0x0f ? "acknowledge request" : `decoder control ${h2(b)}`;
    return { text: t, params: [["last control", t]] };
  }
  // 0001-xxxx consist control
  if ((b & 0xf0) === 0x10) {
    if ((b & 0xfe) === 0x12 && p.length >= 2) {
      const a = p[1] & 0x7f;
      const t = a ? `consist address ${a}${b & 1 ? " (reversed)" : ""}` : "consist removed";
      return { text: t, params: [["consist", a ? `${a}${b & 1 ? " reversed" : ""}` : "none"]] };
    }
    return { text: `consist control ${h2(b)}`, params: [] };
  }
  // 001x-xxxx advanced operations
  if (b === 0x3f && p.length >= 2) {
    const s = speed128(p[1]);
    return { text: `speed ${s.speed} ${s.dir}`, params: [["speed", s.speed], ["direction", s.dir], ["speed steps", "128"]] };
  }
  if (b === 0x3c && p.length >= 3) {   // speed, direction and functions
    const s = speed128(p[1]);
    const fns = [];
    for (let i = 2; i < p.length && i < 6; i++) fns.push({ from: (i - 2) * 8, count: 8, bits: p[i] });
    const ft = fns.map((f) => fnText(f.from, f.count, f.bits)).join(", ");
    return { text: `speed ${s.speed} ${s.dir}, ${ft}`,
             params: [["speed", s.speed], ["direction", s.dir], ["speed steps", "128"]], fns };
  }
  if (b === 0x3b && p.length >= 2) {
    // Target speed. The byte is RGGG-GGGG for 128-step locos or 00RG-GGGG
    // for 28-step ones, and the packet doesn't say which -- shown as
    // 128-step, with the raw byte for reference.
    const s = speed128(p[1]);
    return { text: `target speed ${s.speed} ${s.dir} (raw ${h2(p[1])})`, params: [["target speed", `${s.speed} (raw ${h2(p[1])})`]] };
  }
  if (b === 0x3e && p.length >= 2) {   // special operating modes
    const v = p[1];
    const pos = ["not in consist", "middle loco", "lead loco", "rear loco"][(v >> 2) & 3];
    const flags = [pos];
    if (v & 0x10) flags.push("shunting");
    if (v & 0x20) flags.push("west");
    if (v & 0x40) flags.push("east");
    if (v & 0x80) flags.push("MAN");
    return { text: `operating mode: ${flags.join(", ")}`, params: [["operating mode", flags.join(", ")]] };
  }
  if (b === 0x3d && p.length >= 3) {   // analog function group
    const ch = p[1];
    const name = ch === 1 ? "volume" : ch >= 0x10 && ch <= 0x1f ? `position ${ch - 0x10}` : `analog ${ch}`;
    return { text: `${name} = ${p[2]}`, params: [[name, String(p[2])]] };
  }
  if ((b & 0xe0) === 0x20) return { text: `advanced operation ${h2(b)} (reserved)`, params: [] };

  // 01xx-xxxx 28-step speed
  if ((b & 0xc0) === 0x40) {
    const s = speed28(b);
    return { text: `speed ${s.speed} ${s.dir}`, params: [["speed", s.speed], ["direction", s.dir], ["speed steps", "28"]] };
  }
  // 10xx-xxxx function groups
  if ((b & 0xe0) === 0x80) {           // 100D-DDDD: F0 = bit 4, F1-F4 = bits 0-3
    const bits = ((b >> 4) & 1) | ((b & 0x0f) << 1);
    return { text: fnText(0, 5, bits), params: [], fns: [{ from: 0, count: 5, bits }] };
  }
  if ((b & 0xf0) === 0xb0) return { text: fnText(5, 4, b & 0x0f), params: [], fns: [{ from: 5, count: 4, bits: b & 0x0f }] };
  if ((b & 0xf0) === 0xa0) return { text: fnText(9, 4, b & 0x0f), params: [], fns: [{ from: 9, count: 4, bits: b & 0x0f }] };

  // 110x-xxxx feature expansion
  const fnBlocks = { 0xde: 13, 0xdf: 21, 0xd8: 29, 0xd9: 37, 0xda: 45, 0xdb: 53, 0xdc: 61 };
  if (b in fnBlocks && p.length >= 2) {
    const from = fnBlocks[b];
    return { text: fnText(from, 8, p[1]), params: [], fns: [{ from, count: 8, bits: p[1] }] };
  }
  if (b === 0xdd && p.length >= 2) {   // binary state, short form
    const n = p[1] & 0x7f, on = p[1] & 0x80 ? "on" : "off";
    if (n === 0) return { text: `all binary states 29-127 ${on}`, params: [] };
    return { text: `binary state ${n} ${on}`, params: [[`binary state ${n}`, on]] };
  }
  if (b === 0xc0 && p.length >= 3) {   // binary state, long form
    const n = (p[2] << 7) | (p[1] & 0x7f), on = p[1] & 0x80 ? "on" : "off";
    if (n === 0) return { text: `all binary states 29-32767 ${on}`, params: [] };
    return { text: `binary state ${n} ${on}`, params: [[`binary state ${n}`, on]] };
  }
  if (b === 0xc1 && p.length >= 4) {   // time command (RCN-211 5.1)
    const cc = p[1] >> 6;
    if (cc === 0) {
      const mm = p[1] & 0x3f, hh = p[2] & 0x1f, wd = WEEKDAYS[p[2] >> 5], factor = p[3] & 0x3f;
      const t = `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")} ${wd}`;
      const speed = factor === 0 ? "stopped" : `×${factor}`;
      return { text: `model time ${t}, clock ${speed}${p[3] & 0x80 ? " (jump)" : ""}`,
               params: [["model time", t], ["clock speed", speed]] };
    }
    if (cc === 1) {
      const day = p[1] & 0x1f, month = p[2] >> 4, year = ((p[2] & 0x0f) << 8) | p[3];
      const d = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      return { text: `model date ${d}`, params: [["model date", d]] };
    }
    if (cc === 2) {
      const f = f16((p[2] << 8) | p[3]);
      return { text: `model time scale ×${+f.toFixed(3)}`, params: [["clock speed", `×${+f.toFixed(3)}`]] };
    }
    return { text: "time command (reserved)", params: [] };
  }
  if (b === 0xc2 && p.length >= 3) {
    const ms = (p[1] << 8) | p[2];
    return { text: `system time ${ms} ms`, params: [["system time", `${ms} ms`]] };
  }
  if (b === 0xc3 && p.length >= 4) {
    const idx = p[1] & 0x0f, mask = (p[2] << 8) | p[3];
    const t = `command station features [${idx}] = 0x${mask.toString(16).toUpperCase().padStart(4, "0")}`;
    return { text: t, params: [[`features [${idx}]`, `0x${mask.toString(16).toUpperCase().padStart(4, "0")}`]] };
  }
  if ((b & 0xe0) === 0xc0) return { text: `feature expansion ${h2(b)} (reserved)`, params: [] };

  // 111x-xxxx CV access
  return cvAccess(p);
}

function accessory(d) {
  if (d.length < 2) return { kind: "acc", key: null, text: "ACC (truncated)", params: [] };
  const b1 = d[0], b2 = d[1];
  // High address bits are sent inverted; RCN-213 linear user numbering.
  const wire = (((~b2 >> 4) & 0x07) << 8) | ((b1 & 0x3f) << 2) | ((b2 >> 1) & 0x03);
  const user = wire >= 4 ? wire - 3 : wire + 2045;

  if (b2 & 0x80) {                     // basic: 10AA-AAAA 1AAA-DAAR
    const key = `ACC ${user}`;
    if (d.length === 2) {
      const r = b2 & 1, on = !!(b2 & 0x08);
      const pos = r ? "straight / green" : "diverging / red";
      const params = [["last command", `R=${r} ${on ? "ON" : "off"}`], ["wire address", String(wire)]];
      if (on) params.unshift(["position", pos]);   // only an activation moves it
      return { kind: "acc", key, text: `${key} R=${r} ${pos} ${on ? "ON" : "off"}`, params };
    }
    const cv = cvAccess(d.subarray(2));            // POM: 10AA-AAAA 1AAA-1AA0 + CV access
    return { kind: "acc", key, text: `${key} ${cv.text}`, params: cv.params };
  }
  const key = `ACC-EXT ${user}`;
  if ((b2 & 0x09) === 0x01) {          // extended: 10AA-AAAA 0AAA-0AA1
    if (d.length === 3) {
      return { kind: "acc", key, text: `${key} value ${d[2]}`,
               params: [["value / aspect", String(d[2])], ["wire address", String(wire)]] };
    }
    if (d.length > 3) {
      const cv = cvAccess(d.subarray(2));
      return { kind: "acc", key, text: `${key} ${cv.text}`, params: cv.params };
    }
  }
  if (b2 & 0x08) {                     // 10AA-AAAA 0AAA-1AAT
    return { kind: "acc", key: null, text: `ACC NOP ${user} (${b2 & 1 ? "extended" : "basic"})`, params: [] };
  }
  return { kind: "acc", key: null, text: `ACC ${user} unknown ${h2(b2)}`, params: [] };
}

// DCC-A automatic logon, RCN-218: 1111-1110 {command} ...
function dccA(d) {
  const c = d[1];
  let t;
  if ((c & 0xfc) === 0xfc) {
    const group = ["all decoders", "loco decoders", "accessory decoders", "all decoders, now"][c & 3];
    const zid = d.length >= 4 ? ` station ID 0x${hex(d.subarray(2, 4)).replace(" ", "")}` : "";
    const sid = d.length >= 5 ? ` session ${d[4]}` : "";
    t = `LOGON_ENABLE (${group})${zid}${sid}`;
  } else if ((c & 0xf0) === 0xd0) t = "SELECT";
  else if ((c & 0xf0) === 0xe0) t = "LOGON_ASSIGN";
  else t = { 0: "GET_DATA_START", 1: "GET_DATA_CONT", 2: "SET_DATA", 3: "SET_DATA_END" }[c] || `command ${h2(c)}`;
  return { kind: "other", key: null, text: `DCC-A ${t}`, params: [] };
}

function decode(bytes) {
  const d = bytes.subarray(0, bytes.length - 1);   // without the checksum
  const n = d.length;
  const a = d[0];

  if (a === 0xff) {
    if (n === 2 && d[1] === 0x00) return { kind: "idle", key: null, text: "IDLE", params: [] };
    return { kind: "other", key: null, text: `RailComPlus (proprietary, ${n} bytes)`, params: [] };
  }
  if (a === 0xfe && n >= 2) return dccA(d);
  if (a === 0xfd) return { kind: "other", key: null, text: "advanced extended packet (S-9.2.1.1)", params: [] };
  if (a === 0x00) {
    if (n === 2 && d[1] === 0x00) return { kind: "reset", key: null, text: "RESET", params: [] };
    const ins = locoInstr(d.subarray(1));
    return { kind: "broadcast", key: "BROADCAST", text: `BROADCAST ${ins.text}`, params: ins.params, fns: ins.fns };
  }
  if (a <= 0x7f) {
    const ins = locoInstr(d.subarray(1));
    const key = `LOCO ${a}`;
    return { kind: "loco", key, text: `${key} ${ins.text}`, params: ins.params, fns: ins.fns };
  }
  if (a <= 0xbf) return accessory(d);
  if (a <= 0xe7 && n >= 2) {
    const ins = locoInstr(d.subarray(2));
    const key = `LOCO ${((a & 0x3f) << 8) | d[1]}`;
    return { kind: "loco", key, text: `${key} ${ins.text}`, params: ins.params, fns: ins.fns };
  }
  return { kind: "other", key: null, text: `reserved address ${a}`, params: [] };
}

// Filter group for the log checkboxes.
const group = (kind) => (kind === "loco" || kind === "acc" || kind === "idle" ? kind : "other");

// "Show" selector: "all", "kind:loco" / "kind:acc", or "key:LOCO 3" etc.
// Applies to both the state table and the log.
const pick = () => document.getElementById("pick").value;

function matchesPick(kind, key) {
  const v = pick();
  if (v === "all") return true;
  if (v.startsWith("kind:")) return group(kind) === v.slice(5);
  return key === v.slice(4);
}

let pickDirty = false;

// Rebuilds the selector from the addresses in the state table, keeping
// the current choice (or falling back to "everything" if it's gone).
function renderPick() {
  const sel = document.getElementById("pick");
  const current = sel.value;
  const byKind = { loco: [], acc: [] };
  for (const [key, e] of state) if (byKind[e.kind]) byKind[e.kind].push([e.order, key]);

  const opts = ['<option value="all">everything</option>'];
  const groups = [["loco", "Locos", "all locos"], ["acc", "Accessories", "all accessories"]];
  for (const [kind, label, allLabel] of groups) {
    const keys = byKind[kind].sort((a, b) => a[0] - b[0]).map(([, k]) => k);
    opts.push(`<optgroup label="${label}"><option value="kind:${kind}">${allLabel}</option>` +
      keys.map((k) => `<option value="key:${k}">${k}</option>`).join("") + "</optgroup>");
  }
  sel.innerHTML = opts.join("");
  sel.value = [...sel.options].some((o) => o.value === current) ? current : "all";
}

// ---------------------------------------------------------------------------
// State table: one entry per address, last known value of each parameter.
// ---------------------------------------------------------------------------

const state = new Map();   // key -> { kind, order, params: Map(name -> {value, at}) }
let stateDirty = false;

function updateState(dec, now) {
  if (!dec.key || (dec.params.length === 0 && !dec.fns)) return;
  let e = state.get(dec.key);
  if (!e) {
    const num = parseInt(dec.key.replace(/^\D+/, ""), 10) || 0;
    e = { kind: dec.kind, order: (dec.kind === "loco" ? 0 : dec.kind === "acc" ? 1 : 2) * 1e6 + num,
          params: new Map(), fns: new Map() };
    state.set(dec.key, e);
    pickDirty = true;
  }
  const params = [...dec.params];
  if (dec.fns) {
    for (const f of dec.fns) for (let i = 0; i < f.count; i++) e.fns.set(f.from + i, !!((f.bits >> i) & 1));
    const known = [...e.fns.keys()].sort((x, y) => x - y);
    const on = known.filter((k) => e.fns.get(k)).map((k) => `F${k}`);
    params.push(["functions on", `${on.length ? on.join(" ") : "none"}  (of F${known[0]}–F${known[known.length - 1]})`]);
  }
  for (const [name, value] of params) {
    const prev = e.params.get(name);
    if (!prev || prev.value !== value) {
      e.params.set(name, { value, at: now, changedAt: now });
    } else {
      prev.at = now;
    }
  }
  stateDirty = true;
}

function age(ms) {
  if (ms < 1000) return "now";
  if (ms < 60000) return `${Math.floor(ms / 1000)} s ago`;
  return `${Math.floor(ms / 60000)} min ago`;
}

function renderState() {
  const body = document.getElementById("state-body");
  const now = performance.now();
  const rows = [];
  const entries = [...state.entries()]
    .filter(([key, e]) => matchesPick(e.kind, key))
    .sort((a, b) => a[1].order - b[1].order);
  for (const [key, e] of entries) {
    let first = true;
    for (const [name, p] of e.params) {
      const tr = document.createElement("tr");
      if (now - p.changedAt < 300) tr.className = "changed";
      if (first) {
        const td = document.createElement("td");
        td.className = "addr";
        td.rowSpan = e.params.size;
        td.innerHTML = `<span class="tag ${e.kind}">${e.kind}</span> ${key.replace(/^\S+ /, "")}`;
        tr.appendChild(td);
        first = false;
      }
      tr.insertAdjacentHTML("beforeend",
        `<td>${name}</td><td class="val mono">${p.value}</td><td class="age">${age(now - p.at)}</td>`);
      rows.push(tr);
    }
  }
  body.replaceChildren(...rows);
  const empty = document.getElementById("state-empty");
  empty.textContent = state.size ? "Nothing for this selection yet." : "No locos or accessories seen yet.";
  empty.style.display = rows.length ? "none" : "";
}

// ---------------------------------------------------------------------------
// Log
// ---------------------------------------------------------------------------

const log = [];            // all entries (up to LOG_MAX), filtered at render time
let pendingLog = [];       // entries not yet in the DOM
let paused = false;
const lastSeen = new Map(); // raw hex -> last time seen (hide repeats)

const filters = () => new Set([...document.querySelectorAll(".f:checked")].map((c) => c.value));
const hideRepeats = () => document.getElementById("hide-repeats").checked;

function visible(entry, f) {
  if (hideRepeats() && entry.repeat) return false;
  // With a loco/accessory picked in "Show", that choice decides; the type
  // checkboxes only filter the "everything" view.
  return pick() === "all" ? f.has(group(entry.kind)) : matchesPick(entry.kind, entry.key);
}

function logRow(entry) {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="mono">${(entry.t / 1000).toFixed(3)}</td>` +
    `<td class="mono">${entry.raw}</td>` +
    `<td><span class="tag ${entry.kind}">${entry.kind}</span></td>` +
    `<td>${entry.text}</td>`;
  return tr;
}

function flushLog() {
  if (paused || pendingLog.length === 0) return;
  const scroller = document.getElementById("log-scroll");
  const atBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 40;
  const body = document.getElementById("log-body");
  const f = filters();
  const frag = document.createDocumentFragment();
  for (const e of pendingLog) if (visible(e, f)) frag.appendChild(logRow(e));
  pendingLog = [];
  body.appendChild(frag);
  while (body.rows.length > LOG_MAX) body.deleteRow(0);
  if (atBottom) scroller.scrollTop = scroller.scrollHeight;
}

function rerenderLog() {
  const body = document.getElementById("log-body");
  const f = filters();
  const frag = document.createDocumentFragment();
  for (const e of log) if (visible(e, f)) frag.appendChild(logRow(e));
  body.replaceChildren(frag);
  pendingLog = [];
  const scroller = document.getElementById("log-scroll");
  scroller.scrollTop = scroller.scrollHeight;
}

// ---------------------------------------------------------------------------
// Packet intake (shared by BLE and demo mode)
// ---------------------------------------------------------------------------

let total = 0;
let rateCount = 0;

function onPacket(tMs, bytes) {
  const raw = hex(bytes);
  const dec = decode(bytes);
  const prev = lastSeen.get(raw);
  const repeat = prev !== undefined && tMs - prev < REPEAT_WINDOW_MS;
  lastSeen.set(raw, tMs);
  if (lastSeen.size > 4096) lastSeen.clear();

  total++;
  rateCount++;
  updateState(dec, performance.now());

  const entry = { t: tMs, raw, kind: dec.kind, key: dec.key, text: dec.text, repeat };
  log.push(entry);
  if (log.length > LOG_MAX) log.shift();
  pendingLog.push(entry);
}

// Records as defined in main/ble_link.h: u8 len, u32le time_ms, data[len].
function onNotification(event) {
  const dv = event.target.value;
  let o = 0;
  while (o + 5 <= dv.byteLength) {
    const len = dv.getUint8(o);
    const t = dv.getUint32(o + 1, true);
    if (len < 3 || o + 5 + len > dv.byteLength) break;
    onPacket(t, new Uint8Array(dv.buffer.slice(dv.byteOffset + o + 5, dv.byteOffset + o + 5 + len)));
    o += 5 + len;
  }
}

// ---------------------------------------------------------------------------
// Web Bluetooth connection
// ---------------------------------------------------------------------------

let device = null;

function setStatus(text, cls) {
  document.getElementById("state").textContent = text;
  document.getElementById("dot").className = "dot " + (cls || "");
}

function notice(msg) {
  const n = document.getElementById("notice");
  n.textContent = msg;
  n.style.display = msg ? "block" : "none";
}

async function connect() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect();
    return;
  }
  try {
    stopDemo();
    setStatus("choosing device…", "busy");
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
    device.addEventListener("gattserverdisconnected", onDisconnected);
    setStatus(`connecting to ${device.name || "device"}…`, "busy");
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    const ch = await service.getCharacteristic(PACKETS_UUID);
    ch.addEventListener("characteristicvaluechanged", onNotification);
    await ch.startNotifications();
    setStatus(`connected: ${device.name || "DCC-Sniffer"}`, "on");
    document.getElementById("connect").textContent = "Disconnect";
    notice("");
  } catch (err) {
    setStatus("disconnected", err.name === "NotFoundError" ? "" : "err");
    if (err.name !== "NotFoundError") notice(`Bluetooth: ${err.message}`);
  }
}

function onDisconnected() {
  setStatus("disconnected", "");
  document.getElementById("connect").textContent = "Connect";
}

// ---------------------------------------------------------------------------
// Demo mode: synthetic traffic through the same pipeline, for trying the
// page without hardware.
// ---------------------------------------------------------------------------

let demoTimer = null;

function withChecksum(arr) {
  return new Uint8Array([...arr, arr.reduce((x, b) => x ^ b, 0)]);
}

function accBytes(user, r, on) {
  const wire = user + 3;
  const b1 = 0x80 | ((wire >> 2) & 0x3f);
  const b2 = 0x80 | ((~(wire >> 8) & 0x07) << 4) | (on ? 0x08 : 0) | ((wire & 0x03) << 1) | r;
  return [b1, b2];
}

function startDemo() {
  stopDemo();
  let t = 0, speed = 0, dir = 1, tick = 0;
  const turnouts = { 1: 1, 2: 0, 12: 1 };
  setStatus("demo", "on");
  demoTimer = setInterval(() => {
    for (let i = 0; i < 15; i++) {   // ~300 packets/s
      t += 3 + Math.floor(Math.random() * 2);
      tick++;
      let p;
      if (tick % 4 === 0) {
        const v = speed === 0 ? 0 : speed + 3;   // 28-step code, see locoInstr()
        p = [0x03, 0x40 | (dir << 5) | ((v & 1) << 4) | (v >> 1)];
      }
      else if (tick % 9 === 0) p = [0x03, 0x90 | (speed > 0 ? 0x01 : 0)];
      else if (tick % 13 === 0) p = [0xc4, 0xd2, 0x3f, 0x80 | 25];
      else p = [0xff, 0x00];
      onPacket(t, withChecksum(p));
    }
    if (Math.random() < 0.05) speed = Math.max(0, Math.min(28, speed + (Math.random() < 0.5 ? -3 : 3)));
    if (speed === 0 && Math.random() < 0.02) dir ^= 1;
    if (Math.random() < 0.03) {
      const ids = Object.keys(turnouts);
      const user = Number(ids[Math.floor(Math.random() * ids.length)]);
      turnouts[user] ^= 1;
      for (let i = 0; i < 4; i++) onPacket(t += 4, withChecksum(accBytes(user, turnouts[user], true)));
      for (let i = 0; i < 2; i++) onPacket(t += 4, withChecksum(accBytes(user, turnouts[user], false)));
    }
  }, 50);
}

function stopDemo() {
  if (demoTimer) clearInterval(demoTimer);
  demoTimer = null;
  if (!device || !device.gatt.connected) setStatus("disconnected", "");
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------

document.getElementById("connect").addEventListener("click", connect);
document.getElementById("demo").addEventListener("click", () => (demoTimer ? stopDemo() : startDemo()));
document.getElementById("pause").addEventListener("click", (e) => {
  paused = !paused;
  e.target.textContent = paused ? "Resume" : "Pause";
  if (!paused) rerenderLog();
});
document.getElementById("clear").addEventListener("click", () => {
  log.length = 0; pendingLog = []; state.clear(); lastSeen.clear(); total = 0;
  renderPick(); rerenderLog(); renderState();
});
document.getElementById("csv").addEventListener("click", () => {
  const lines = ["time_s,raw,type,description",
    ...log.map((e) => `${(e.t / 1000).toFixed(3)},${e.raw},${e.kind},"${e.text.replace(/"/g, '""')}"`)];
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = `dcc-log-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.csv`;
  a.click();
});
for (const el of document.querySelectorAll(".f, #hide-repeats")) el.addEventListener("change", rerenderLog);
document.getElementById("pick").addEventListener("change", () => { rerenderLog(); renderState(); });

setInterval(() => {
  document.getElementById("rate").textContent = rateCount;
  document.getElementById("total").textContent = total.toLocaleString();
  rateCount = 0;
}, 1000);

(function frame() {
  if (pickDirty) { pickDirty = false; renderPick(); }
  flushLog();
  if (stateDirty) { stateDirty = false; renderState(); }
  requestAnimationFrame(frame);
})();
setInterval(renderState, 1000);   // keep the "Updated" ages ticking

if (!navigator.bluetooth) {
  document.getElementById("connect").disabled = true;
  notice(window.isSecureContext
    ? "This browser has no Web Bluetooth. Use Chrome or Edge (desktop or Android). Demo mode still works."
    : "Web Bluetooth needs a secure context: open this page via http://localhost (make web) or https, not file://.");
}
renderState();
</script>
</body>
</html>
