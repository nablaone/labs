# Espressif's QEMU fork emulates ESP32 chip revision 0, which Zephyr's
# esp32 soc_init rejects by default as unsupported (real ESP32-WROOM-32
# modules in the wild are typically newer revisions). Harmless on real
# hardware -- this only widens which revisions are accepted, doesn't
# restrict anything -- so it's fine to leave enabled for both QEMU and the
# real board this overlay/conf pair targets.
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y
